version: '3.8'

services:
  ap-db:
    image: postgres:16
    env_file:
      - ./db/.env
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:latest
    mem_limit: 2gb
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    mem_limit: 4gb
    env_file:
      - ./clickhouse/.env
    volumes:
      - ./data/clickhouse/data:/var/lib/clickhouse
      - ./data/clickhouse/logs:/var/log/clickhouse-server
      - ./clickhouse/config/performance.xml:/etc/clickhouse-server/config.d/performance.xml:ro
    healthcheck:
      test: [ "CMD", "clickhouse", "client", "--host", "localhost", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  superset:
    image: superset-native
    environment:
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
    volumes:
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py
    mem_limit: 2gb
    depends_on:
      ap-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9088:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    image: bao-api-gateway-native
    mem_limit: 2gb
    ports:
      - "9085:8085"
    volumes:
      - ./bao-api-gateway/config:/opt/bao-api-gateway
    depends_on:
      - identity
      - data-pipeline
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  identity:
    image: bao-identity-native
    mem_limit: 2gb
    ports:
      - "9086:8086"
    volumes:
      - ./bao-identity/config:/opt/bao-identity
    depends_on:
      ap-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  data-pipeline:
    image: bao-data-pipeline-native
    mem_limit: 3gb
    volumes:
      - ./bao-data-pipeline/config/bao-data-pipeline.conf:/opt/bao-data-pipeline/bao-data-pipeline.conf
      - ./bao-data-pipeline/config/bao-data-pipeline-key.json:/opt/bao-data-pipeline/bao-data-pipeline-key.json
      - ./data/analytics-platform/bao-data-pipeline-cache:/opt/bao-data-pipeline/data-pipeline
      - ./data/analytics-platform/bao-data-pipeline:/data
    depends_on:
      ap-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dhis2-gateway:
    image: dhis2-superset-gateway-native
    mem_limit: 2gb
    ports:
      - "9089:8092"
    volumes:
      - ./dhis2-superset-gateway/config/dhis2-superset-gateway.conf:/opt/dhis2-superset-gateway/dhis2-superset-gateway.conf
    depends_on:
      superset:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8092/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: apachepulsar/pulsar:3.3.9
    container_name: zookeeper
    restart: on-failure
    volumes:
      - ./data/pulsar/zookeeper:/pulsar/data/zookeeper
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - PULSAR_MEM=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
    platform: linux/arm64
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env.py conf/zookeeper.conf && \
        bin/generate-zookeeper-config.sh conf/zookeeper.conf && \
        exec bin/pulsar zookeeper
    healthcheck:
      test: [ "CMD", "bin/pulsar-zookeeper-ruok.sh" ]
      interval: 10s
      timeout: 5s
      retries: 30

  pulsar-init:
    container_name: pulsar-init
    hostname: pulsar-init
    image: apachepulsar/pulsar:3.3.9
    platform: linux/arm64
    command:
      - bash
      - -c
      - |
        bin/pulsar initialize-cluster-metadata \
        --cluster cluster-a \
        --zookeeper zookeeper:2181 \
        --configuration-store zookeeper:2181 \
        --web-service-url http://pulsar:8080 \
        --broker-service-url pulsar://pulsar:6650
    depends_on:
      zookeeper:
        condition: service_healthy

  bookie:
    image: apachepulsar/pulsar:3.3.9
    container_name: bookie
    restart: on-failure
    platform: linux/arm64
    environment:
      - clusterName=cluster-a
      - zkServers=zookeeper:2181
      - metadataServiceUri=metadata-store:zk:zookeeper:2181
      - advertisedAddress=bookie
      - BOOKIE_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    volumes:
      - ./data/pulsar/bookkeeper:/pulsar/data/bookkeeper
    command: bash -c "bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar bookie"

  pulsar:
    image: apachepulsar/pulsar:3.3.9
    container_name: pulsar
    hostname: pulsar
    platform: linux/arm64
    restart: on-failure
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - zookeeperServers=zookeeper:2181
      - clusterName=cluster-a
      - managedLedgerDefaultEnsembleSize=1
      - managedLedgerDefaultWriteQuorum=1
      - managedLedgerDefaultAckQuorum=1
      - advertisedAddress=pulsar
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    depends_on:
      zookeeper:
        condition: service_healthy
      bookie:
        condition: service_started
      pulsar-init:
        condition: service_completed_successfully
    volumes:
      - ./data/pulsar:/pulsar/data
    mem_limit: 6gb
    command: bash -c "bin/apply-config-from-env.py conf/broker.conf && exec bin/pulsar broker"
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/config:/etc/nginx/conf.d:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      gateway:
        condition: service_started
      superset:
        condition: service_started
    restart: unless-stopped